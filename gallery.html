<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | Edukids India | School Life Captured</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gallery-hero {
            background: linear-gradient(rgba(30, 27, 75, 0.9), rgba(67, 56, 202, 0.9)), url('https://images.unsplash.com/photo-1543269865-cbf427effbad?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            color: var(--white);
            padding: 100px 5%;
            text-align: center;
        }

        .filter-container { display: flex; justify-content: center; gap: 20px; margin: 40px 0; }
        .filter-btn { padding: 12px 30px; border-radius: 50px; background: white; border: 1px solid #efefef; cursor: pointer; font-weight: 700; transition: var(--transition); }
        .filter-btn.active { background: var(--primary-indigo); color: white; border-color: var(--primary-indigo); }

        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .gallery-item { border-radius: 25px; overflow: hidden; cursor: pointer; position: relative; aspect-ratio: 1; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: var(--transition); }
        .gallery-item:hover img { transform: scale(1.1); filter: brightness(0.8); }
        .gallery-item i { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 2rem; opacity: 0; transition: var(--transition); }
        .gallery-item:hover i { opacity: 1; }

        /* Lightbox */
        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 50px; }
        .lightbox.active { display: flex; }
        .lightbox-img { max-width: 90%; max-height: 80%; border-radius: 10px; }
        .lightbox-close { position: absolute; top: 40px; right: 40px; color: white; font-size: 2.5rem; cursor: pointer; }
    </style>
</head>
<body>
    <header id="header-placeholder"></header>

    <div class="gallery-hero">
        <h1 class="hero-title" style="color: var(--white); font-size: 4rem;">Captured Memories</h1>
        <p style="opacity: 0.8; font-size: 1.2rem; max-width: 600px; margin: 0 auto;">Take a peek into the vibrant daily life at Edukids, from modern labs to green playgrounds.</p>
    </div>

    <!-- FILTER BAR -->
    <section>
        <div class="container">
            <div class="filter-container">
                <button class="filter-btn active" data-filter="all">All Photos</button>
                <button class="filter-btn" data-filter="campus">School Campus</button>
                <button class="filter-btn" data-filter="classroom">Learning</button>
                <button class="filter-btn" data-filter="sports">Physical Activity</button>
                <button class="filter-btn" data-filter="arts">Art & STEM</button>
            </div>

            <div class="gallery-grid">
                <div class="gallery-item" data-category="campus"><img src="gallery.png" alt="Campus"><i class="fas fa-search-plus"></i></div>
                <div class="gallery-item" data-category="classroom"><img src="hero_main.png" alt="Learning"><i class="fas fa-search-plus"></i></div>
                <div class="gallery-item" data-category="sports"><img src="boy_skateboard.png" alt="Sports"><i class="fas fa-search-plus"></i></div>
                <div class="gallery-item" data-category="arts"><img src="books.png" alt="Arts"><i class="fas fa-search-plus"></i></div>
                <div class="gallery-item" data-category="classroom"><img src="girl_hero.png" alt="Classroom"><i class="fas fa-search-plus"></i></div>
                <div class="gallery-item" data-category="arts"><img src="quiz_section.png" alt="STEM"><i class="fas fa-search-plus"></i></div>
            </div>
        </div>
    </section>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightboxClose">&times;</span>
        <img src="" alt="Zoomed" class="lightbox-img" id="lightboxImg">
    </div>

    <footer id="footer-placeholder"></footer>
    <script src="main.js"></script>
    <script>
        // Gallery Filter Logic
        const filterBtns = document.querySelectorAll('.filter-btn');
        const items = document.querySelectorAll('.gallery-item');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filterValue = btn.getAttribute('data-filter');

                items.forEach(item => {
                    if (filterValue === 'all' || item.getAttribute('data-category') === filterValue) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        });

        // Lightbox Logic
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const closeBtn = document.getElementById('lightboxClose');

        items.forEach(item => {
            item.addEventListener('click', () => {
                const src = item.querySelector('img').src;
                lightboxImg.src = src;
                lightbox.classList.add('active');
            });
        });

        closeBtn.addEventListener('click', () => lightbox.classList.remove('active'));
    </script>
</body>
</html>
