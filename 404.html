<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Udaaan School</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .error-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: var(--primary-indigo);
            line-height: 1;
            margin-bottom: 20px;
        }
        .error-message {
            font-size: 2rem;
            color: var(--primary-navy);
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <header id="header-placeholder"></header>

    <main class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-message">Oops! This page went to recess.</h1>
        <p style="margin-bottom: 40px; color: var(--text-muted); max-width: 500px;">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="index.html" class="btn btn-primary">Back to Home</a>
    </main>

    <footer id="footer-placeholder"></footer>

    <script src="main.js"></script>
</body>
</html>
